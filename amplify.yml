version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm -v
        - npm ci

    build:
      commands:
        - node -v
        - if [ -z "$APP_ENV" ]; then if [ "$AWS_BRANCH" = "main" ] || [ "$AWS_BRANCH" = "prod" ] || [ "$AWS_BRANCH" = "production" ]; then export APP_ENV=prod; else export APP_ENV=stage; fi; fi
        - echo "Building Next.js profile $APP_ENV for branch $AWS_BRANCH"
        - npm run "build:$APP_ENV"
        - ls -la

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - ~/.nvm/versions/node/v22.*

appRoot: .
